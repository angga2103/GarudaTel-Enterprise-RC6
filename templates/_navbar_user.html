<script>
  async function changePass() {
    const { value: pVals } = await Swal.fire({
      title: 'Ganti Password',
      html: `
        <div class="relative flex items-center mb-3">
    <input id="cp_old" type="password" placeholder="Password Saat Ini" class="w-full border border-slate-200 rounded-xl pl-3 pr-10 py-3 text-sm focus:outline-none focus:border-[#115E59]">
    <button type="button" onclick="window.toggleUserPass('cp_old')" class="absolute right-0 mr-3 text-slate-400 z-10 cursor-pointer p-2 hover:text-slate-700">
        <svg id="icon_cp_old" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
    </button>
</div>
        <div class="relative flex items-center mb-2">
    <input id="cp_new" type="password" placeholder="Password Baru (Min. 6 Karakter)" class="w-full border border-slate-200 rounded-xl pl-3 pr-10 py-3 text-sm focus:outline-none focus:border-[#115E59]">
    <button type="button" onclick="window.toggleUserPass('cp_new')" class="absolute right-0 mr-3 text-slate-400 z-10 cursor-pointer p-2 hover:text-slate-700">
        <svg id="icon_cp_new" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
    </button>
</div>
      `,
      focusConfirm: false, showCancelButton: true, confirmButtonText: 'Simpan', cancelButtonText: 'Batal', confirmButtonColor: '#115E59',
      preConfirm: () => {
        const o = document.getElementById('cp_old').value;
        const n = document.getElementById('cp_new').value;
        if(!o || !n) { Swal.showValidationMessage('Semua kolom wajib diisi'); return false; }
        return { old_password: o, new_password: n };
      }
    });
    if(!pVals) return;
    
    Swal.fire({title: 'Menyimpan...', didOpen: () => Swal.showLoading(), allowOutsideClick: false, showConfirmButton: false});
    const res = await postJSON('/change-password', pVals);
    if(res.ok) {
        Swal.fire('Berhasil!', 'Password akun Anda telah diubah.', 'success');
    } else {
        Swal.fire('Gagal!', res.body.error, 'error');
    }
  }
</script>

<script>
async function changePinModal() {
    const { value: formValues } = await Swal.fire({
        title: 'Ganti PIN Transaksi',
        html: `
            <div class="text-left mt-2 border-t border-slate-100 pt-4">
                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 block">PIN Saat Ini</label>
                <div class="relative flex items-center mb-4">
    <input id="old_pin" type="password" inputmode="numeric" placeholder="******" class="w-full border border-slate-200 rounded-xl px-3 py-3 text-sm text-center tracking-[1em] focus:outline-none focus:border-[#115E59] shadow-sm transition">
    <button type="button" onclick="window.toggleUserPass('old_pin')" class="absolute right-0 mr-3 text-slate-400 z-10 cursor-pointer p-2 hover:text-slate-700">
        <svg id="icon_old_pin" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
    </button>
</div>
                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 block">PIN Baru (6 Angka)</label>
                <div class="relative flex items-center mb-2">
    <input id="new_pin" type="password" inputmode="numeric" placeholder="******" class="w-full border border-slate-200 rounded-xl px-3 py-3 text-sm text-center tracking-[1em] focus:outline-none focus:border-[#115E59] shadow-sm transition">
    <button type="button" onclick="window.toggleUserPass('new_pin')" class="absolute right-0 mr-3 text-slate-400 z-10 cursor-pointer p-2 hover:text-slate-700">
        <svg id="icon_new_pin" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
    </button>
</div>
            </div>
        `,
        showCancelButton: true, confirmButtonText: 'Simpan PIN', cancelButtonText: 'Batal',
        confirmButtonColor: '#115E59',
        preConfirm: () => {
            const o = document.getElementById('old_pin').value;
            const n = document.getElementById('new_pin').value;
            if (!o || !n) { Swal.showValidationMessage('Semua kolom wajib diisi'); return false; }
            if (n.length !== 6 || isNaN(n)) { Swal.showValidationMessage('PIN Baru wajib 6 Angka'); return false; }
            return { old_pin: o, new_pin: n };
        }
    });
    
    if (formValues) {
        Swal.fire({title: 'Menyimpan...', didOpen: () => Swal.showLoading(), allowOutsideClick: false, showConfirmButton: false});
        const res = await postJSON('/change_pin', formValues);
        if (res.ok) {
            Swal.fire({icon: 'success', title: 'Berhasil!', text: 'PIN Transaksi Anda telah diperbarui. Simpan PIN baru Anda baik-baik!', confirmButtonColor: '#115E59'});
        } else {
            Swal.fire({icon: 'error', title: 'Gagal!', text: res.body.error || 'Terjadi kesalahan.', confirmButtonColor: '#115E59'});
        }
    }
}
</script>

<script>
function verifyAdminAccess(actionType) {
    Swal.fire({
        title: 'Otorisasi Admin',
        html: `<div style="font-size:12px; color:#64748b; margin-bottom:15px;">Masukkan PIN Master Anda untuk melanjutkan:</div>
               <input type="password" id="admin_auth_pin" class="swal2-input" placeholder="PIN 6 Angka" maxlength="6" style="text-align:center; letter-spacing: 5px; font-weight: bold; font-size:18px;">`,
        confirmButtonText: 'Verifikasi',
        confirmButtonColor: '#0f172a',
        showCancelButton: true,
        cancelButtonText: 'Batal',
        preConfirm: () => {
            const pin = document.getElementById('admin_auth_pin').value;
            if (!pin) Swal.showValidationMessage('PIN Master wajib diisi!');
            return pin;
        }
    }).then((result) => {
        if (result.isConfirmed) {
            Swal.fire({title: 'Memeriksa...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
            fetch('/api/verify_admin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({pin: result.value})
            }).then(res => res.json()).then(data => {
                if (data.ok) {
                    Swal.close();
                    // JEDA 300ms AGAR ANIMASI POP-UP SEBELUMNYA SELESAI
                    setTimeout(() => {
                        if (actionType === 'pin') changePinModal();
                        else if (actionType === 'pass') changePass();
                    }, 300);
                } else {
                    Swal.fire('Ditolak!', data.msg, 'error');
                }
            }).catch((err) => Swal.fire('Error Logika', String(err), 'error'));
        }
    });
}
</script>
