<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Sedang Diperbarui</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-5 font-sans text-center cursor-pointer selection:bg-rose-200" onclick="playJingle()">
    
    <audio id="bgMusic" loop preload="auto">
        <source src="/static/jingle.mp3" type="audio/mpeg">
    </audio>

    <div class="w-full max-w-md bg-white rounded-[2rem] shadow-xl border border-slate-100 p-8 relative z-10 transition-transform duration-500 hover:scale-105">
        <div class="w-24 h-24 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6 relative">
            <div class="absolute inset-0 border-4 border-rose-100 rounded-full animate-ping opacity-50"></div>
            <svg class="w-12 h-12 relative z-10 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800 mb-2 tracking-tight">Sistem Diperbarui</h1>
        <p class="text-sm text-slate-500 leading-relaxed mb-8 font-medium">Garuda Tell sedang melakukan pemeliharaan rutin untuk meningkatkan performa. Mohon kembali dalam beberapa saat.</p>
        <div class="inline-block bg-slate-100 text-slate-400 text-[10px] font-bold px-4 py-2 rounded-full uppercase tracking-widest">
            Harap Maklum
        </div>
    </div>

    <div id="audioHint" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-[10px] font-bold px-5 py-2.5 rounded-full animate-bounce shadow-xl opacity-90 tracking-widest uppercase flex items-center gap-2">
        <svg class="w-4 h-4 text-rose-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
        Ketuk Layar Untuk Memutar Musik
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const hint = document.getElementById('audioHint');

        // USAHA 1: Coba putar paksa saat halaman dimuat
        window.addEventListener('load', () => {
            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Jika sukses diputar, sembunyikan petunjuk ketuk layar
                    hint.style.display = 'none'; 
                }).catch(error => {
                    // Jika diblokir Google Chrome/Safari, biarkan petunjuk ketuk layar muncul
                    console.log("Autoplay diblokir, menunggu interaksi user...");
                });
            }
        });

        // USAHA 2: Trik ajaib, begitu layar disentuh/diklik dimana saja, musik langsung meledak!
        function playJingle() {
            if (audio.paused) {
                audio.play();
                hint.style.display = 'none'; // Hilangkan tulisan setelah musik nyala
            }
        }
    </script>
</body>
</html>
