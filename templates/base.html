  <script>
    const Toast = Swal.mixin({
      toast: true, position: 'top-end', showConfirmButton: false,
      timer: 2800, timerProgressBar: true,
      didOpen: (t) => { t.addEventListener('mouseenter', Swal.stopTimer); t.addEventListener('mouseleave', Swal.resumeTimer); }
    });
    function notifySuccess(msg) { Toast.fire({icon:'success', title: msg}); }
    function notifyError(msg)   { Toast.fire({icon:'error',   title: msg}); }
    function notifyInfo(msg)    { Toast.fire({icon:'info',    title: msg}); }
    function rupiah(n) { return 'Rp ' + (Number(n)||0).toLocaleString('id-ID'); }
    
    // 🔥 INI KURIR YANG TADI TERHAPUS, SUDAH SAYA KEMBALIKAN! 🔥
    async function postJSON(url, data) {
      // Get CSRF token from meta tag
      const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const headers = {
        'Content-Type': 'application/json',
      };
      // Add CSRF token header if available
      if (csrfToken) {
        headers['X-CSRFToken'] = csrfToken;
      }
      
      const r = await fetch(url, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(data || {}),
        credentials: 'same-origin',
      });
      let body = {};
      try { body = await r.json(); } catch (_) {}
      return { ok: r.ok, status: r.status, body };
    }
    
    async function copyText(text, label) {
      try {
        await navigator.clipboard.writeText(text);
        notifySuccess((label || 'Tersalin') + ' ke clipboard');
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); notifySuccess((label || 'Tersalin') + ' ke clipboard'); }
        catch(e) { notifyError('Gagal menyalin'); }
        document.body.removeChild(ta);
      }
    }

    // 🔥 PWA LOGIC (DEWABIZ STYLE PAKAI SWEETALERT) 🔥
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      // Muncul 1.5 detik setelah web terbuka
      setTimeout(() => {
          Swal.fire({
            title: 'Instal GarudaTell',
            text: 'Tambahkan ke layar utama untuk akses instan tanpa browser!',
            imageUrl: '/static/assets/images/icons/icon-192x192.png',
            imageWidth: 64,
            imageHeight: 64,
            showCancelButton: true,
            confirmButtonText: 'Instal Sekarang',
            cancelButtonText: 'Nanti Saja',
            reverseButtons: true
          }).then((result) => {
            if (result.isConfirmed && deferredPrompt) {
              deferredPrompt.prompt();
              deferredPrompt = null;
            }
          });
      }, 1500); 
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  
    // FUNGSI MATA GLOBAL UNTUK SWEETALERT
    window.toggleUserPass = function(id) {
        const input = document.getElementById(id);
        const icon = document.getElementById('icon_' + id);
        if(!input) return;
        if (input.type === 'password') {
            input.type = 'text';
            if(icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
        } else {
            input.type = 'password';
            if(icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
        }
    };

  </script>
